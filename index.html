<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Marks Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eef2f7; --card:#ffffff; --ink:#15233b; --muted:#64748b; --line:#dbe3ee;
    --accent:#1d4ed8; --accent-ink:#ffffff; --head:#15233b; --head-ink:#e8eefc;
    --zebra:#f6f9fd; --ok:#0f766e; --err:#b91c1c;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0e1522; --card:#16202f; --ink:#e6edf7; --muted:#93a3bb; --line:#26344a;
      --accent:#5b8cff; --accent-ink:#0b1220; --head:#0b1220; --head-ink:#cfdcf5;
      --zebra:#1a2536; --ok:#2dd4bf; --err:#f87171;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:"Hind Siliguri",system-ui,-apple-system,"Segoe UI",sans-serif;
    background:var(--bg); color:var(--ink); min-height:100vh;
    padding:24px 16px 48px;
  }
  .wrap{max-width:1180px;margin:0 auto}
  h1{font-size:1.9rem;margin:0 0 4px;font-weight:700;letter-spacing:-.01em}
  .sub{color:var(--muted);margin:0 0 22px}
  .grid{display:grid;grid-template-columns:320px 1fr;gap:20px;align-items:start}
  @media (max-width:860px){.grid{grid-template-columns:1fr}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
  .card h2{font-size:1.1rem;margin:0 0 14px;font-weight:600}
  label{display:block;font-weight:500;margin:0 0 6px;font-size:.95rem}
  input[type=text],input[type=number],input[type=search]{
    width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;
    background:transparent;color:var(--ink);font:inherit;
  }
  input:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .field{margin-bottom:16px}
  .labelrow{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
  .labelrow label{margin:0}
  .who{display:flex;align-items:center;gap:8px;margin:0 0 14px;flex-wrap:wrap}
  .who[hidden],.field[hidden],.wait[hidden]{display:none}
  .who-name{font-size:1.35rem;font-weight:700}
  .badge{width:22px;height:22px;flex:none}
  .link{background:none;border:0;padding:2px 4px;width:auto;color:var(--muted);font-weight:500;font-size:.88rem;
    text-decoration:underline;cursor:pointer}
  .wait{margin-top:10px;text-align:center;color:var(--muted);font-size:.92rem}
  button{
    font:inherit;font-weight:600;cursor:pointer;border:0;border-radius:10px;
    padding:12px 16px;background:var(--accent);color:var(--accent-ink);width:100%;
  }
  button:disabled{opacity:.6;cursor:wait}
  .ghost{background:transparent;color:var(--ink);border:1px solid var(--line);width:auto;padding:9px 14px}
  .msg{min-height:22px;margin-top:12px;font-size:.93rem}
  .msg.ok{color:var(--ok)} .msg.err{color:var(--err)}
  .toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px}
  .toolbar input{flex:1}
  .tablebox{overflow:auto;border:1px solid var(--line);border-radius:10px;max-height:70vh}
  table{border-collapse:separate;border-spacing:0;width:100%;min-width:max-content}
  th,td{padding:10px 14px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
  thead th{position:sticky;top:0;background:var(--head);color:var(--head-ink);font-weight:600;z-index:2}
  th:first-child,td:first-child{position:sticky;left:0;text-align:left;z-index:1;font-weight:600;
    background:var(--card);border-right:1px solid var(--line)}
  thead th:first-child{z-index:3;background:var(--head)}
  tbody tr:nth-child(even) td{background:var(--zebra)}
  tbody tr:nth-child(even) td:first-child{background:var(--zebra)}
  td.empty{color:var(--muted)}
  .state{padding:28px;text-align:center;color:var(--muted)}
  @media (prefers-reduced-motion:no-preference){ button{transition:opacity .15s} }
</style>
</head>
<body>
<div class="wrap">
  <div id="who" class="who" hidden>
    <span id="whoName" class="who-name"></span>
    <svg class="badge" viewBox="0 0 24 24" role="img" aria-label="Verified">
      <path fill="#1d9bf0" d="M12 1.5l2.6 1.7 3.1-.2 1.3 2.8 2.7 1.6-.5 3.1 1.1 2.9-2 2.4-.2 3.1-3 .9-2.1 2.3L12 21.6l-3 1.1-2.1-2.3-3-.9-.2-3.1-2-2.4 1.1-2.9-.5-3.1 2.7-1.6L6.3 3.5l3.1.2z"/>
      <path fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M7.8 12.3l3 3 5.6-6.2"/>
    </svg>
    <change"chanchXangeass="button" type="button"></button>
  </div>
  <h1>Daily Marks Tracker</h1>
  <p class="sub">Cut Marks দিন। আজকের তারিখ নিজে থেকেই বসে যাবে।</p>

  <div class="grid">
    <section class="card">
      <h2>Add marks</h2>
      <form id="f" autocomplete="off">
        <div id="nameField" class="field">
          <label for="name">Name (as per Facebook)</label>
          <input id="name" type="text" list="names" required placeholder="e.g. Sazzad Hossain">
          <datalist id="names"></datalist>
        </div>
        <div class="field">
          <label for="marks">Cut Marks</label>
          <input id="marks" type="number" step="any" inputmode="decimal" required placeholder="e.g. 28">
        </div>
        <input id="date" type="hidden">
        <button id="save" type="submit">Save marks</button>
        <div id="wait" class="wait" hidden>Submit again next day</div>
        <div id="msg" class="msg" role="status" aria-live="polite"></div>
      </form>
    </section>

    <section class="card">
      <h2>All students</h2>
      <div class="toolbar">
        <input id="q" type="search" placeholder="Search name">
        <button id="reload" class="ghost" type="button">Refresh</button>
      </div>
      <div class="tablebox"><div id="out" class="state">Loading…</div></div>
    </section>
  </div>
</div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbzW-unXnQaCrjgtXm0Lf6Tus7WnMLapIVqDnPzvwMflC_N_sEvT_rNqg794Uwh3-AySIg/exec";
  const COOLDOWN_MS = 30 * 60 * 1000; // 30 minutes
  const KEY_NAME = "marks_saved_name", KEY_LAST = "marks_last_submit";

  const $ = id => document.getElementById(id);

  // Safe localStorage helpers (storage can be blocked in some browsers)
  const store = {
    get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
    set(k, v){ try{ localStorage.setItem(k, v); }catch(e){} },
    del(k){ try{ localStorage.removeItem(k); }catch(e){} }
  };

  // Saved name: shown at the top with a verified badge, name field hidden
  function applyName(){
    const s = store.get(KEY_NAME);
    $("who").hidden = !s;
    $("whoName").textContent = s || "";
    $("nameField").hidden = !!s;
    $("name").required = !s;
  }
  applyName();

  // "Not you?" lets a wrong or new name be entered again
  $("change").addEventListener("click", () => {
    store.del(KEY_NAME);
    $("name").value = "";
    applyName();
    $("name").focus();
  });

  // Cooldown: after one submit the button stays disabled for 30 minutes (no timer shown)
  let cdTimer = null;
  function remaining(){
    const last = Number(store.get(KEY_LAST) || 0);
    return Math.max(0, last + COOLDOWN_MS - Date.now());
  }
  function tickCooldown(){
    const left = remaining();
    const locked = left > 0;
    $("save").disabled = locked;
    $("wait").hidden = !locked;
    clearTimeout(cdTimer);
    if (locked) cdTimer = setTimeout(tickCooldown, left + 50);
  }
  tickCooldown();
  let DATA = { headers: [], rows: [] };

  // Hidden date = today (local time), format yyyy-MM-dd
  function today(){
    const d = new Date();
    const p = n => String(n).padStart(2, "0");
    return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
  }
  $("date").value = today();

  function esc(s){
    return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }

  function render(){
    const q = $("q").value.trim().toLowerCase();
    const { headers, rows } = DATA;
    $("names").innerHTML = rows.map(r => '<option value="' + esc(r[0]) + '">').join("");

    const list = rows.filter(r => String(r[0]).toLowerCase().includes(q));
    if (!rows.length){
      $("out").className = "state";
      $("out").textContent = "No marks yet. Add the first student on the left.";
      return;
    }
    if (!list.length){
      $("out").className = "state";
      $("out").textContent = "No student matches that name.";
      return;
    }
    $("out").className = "";
    $("out").innerHTML =
      "<table><thead><tr>" + headers.map(h => "<th>" + esc(h) + "</th>").join("") + "</tr></thead><tbody>" +
      list.map(r => "<tr>" + headers.map((_, i) => {
        const v = r[i] === undefined ? "" : r[i];
        return i === 0 ? "<td>" + esc(v) + "</td>"
                       : v === "" ? '<td class="empty">–</td>' : "<td>" + esc(v) + "</td>";
      }).join("") + "</tr>").join("") + "</tbody></table>";
  }

  function say(text, type){ const m = $("msg"); m.textContent = text; m.className = "msg " + (type || ""); }

  async function load(){
    if (API_URL.startsWith("PASTE")){ $("out").textContent = "Set API_URL in index.html first."; return; }
    $("out").className = "state"; $("out").textContent = "Loading…";
    try{
      const res = await fetch(API_URL);
      const j = await res.json();
      if (!j.ok) throw new Error(j.error);
      DATA = j.data; render();
    }catch(e){
      $("out").className = "state"; $("out").textContent = "Could not load data: " + e.message;
    }
  }

  $("f").addEventListener("submit", async ev => {
    ev.preventDefault();
    if (remaining() > 0){ tickCooldown(); return; }
    const name = (store.get(KEY_NAME) || $("name").value).trim();
    const btn = $("save"); btn.disabled = true; say("Saving…");
    let saved = false;
    try{
      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" }, // avoids CORS preflight
        body: JSON.stringify({ name: name, marks: $("marks").value, date: $("date").value })
      });
      const j = await res.json();
      if (!j.ok) throw new Error(j.error);
      DATA = j.data; render();
      say("Saved: " + name + " – " + $("marks").value, "ok");
      saved = true;
      store.set(KEY_LAST, String(Date.now()));
      store.set(KEY_NAME, name);
      applyName();
      $("marks").value = "";
    }catch(e){
      say("Save failed: " + e.message, "err");
    }finally{
      if (saved) tickCooldown(); else btn.disabled = false;
    }
  });

  $("q").addEventListener("input", render);
  $("reload").addEventListener("click", load);
  load();
</script>
</body>
</html>
